# Build Angular (production) and upload to Hostinger via FTP (port 21).
#
# Secrets in GitHub Environment "FTP_SERVER":
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# Site FTP user is already jailed to domains/leonardochiasso.com/public_html.
# Use server-dir ./ — public_html/ would create public_html/public_html/.
#
# Secrets: FTP_SERVER = numeric FTP IP (e.g. 45.152.46.216), not ftp.leonardochiasso.com
#           FTP_USERNAME = u463440555.Gabriel (site-specific account)
#           FTP_PASSWORD = that account's password
name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Copy SPA .htaccess
        run: cp public/.htaccess dist/leo-chiasso/browser/.htaccess

      - name: Confirm dist has index.html
        run: |
          test -f dist/leo-chiasso/browser/index.html
          ls -la dist/leo-chiasso/browser | head -40

      - name: Verify FTP host resolves
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if [ -z "$host" ]; then
            echo "::error::FTP_SERVER secret is empty."
            exit 1
          fi
          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::error::Cannot resolve FTP host '$host'."
            exit 1
          fi
          echo "FTP host resolves."

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/leo-chiasso/browser/
          server-dir: ./
          timeout: 120000
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/assets/media/**
            **/organic-dreams-desfile.MOV
