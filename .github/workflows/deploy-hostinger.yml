# Build Angular (production) and upload to Hostinger via FTP (port 21).
#
# Secrets in GitHub Environment "FTP_SERVER" (Settings → Environments → FTP_SERVER):
#   FTP_SERVER     — FTP IP from hPanel (numeric), NOT ftp.yourdomain.com
#   FTP_USERNAME   — FTP username from hPanel FTP Accounts
#   FTP_PASSWORD   — FTP password
#   FTP login folder is already the site root — upload to ./
#   Do not set FTP_REMOTE_DIR to public_html (creates //paths and deletes remote folders).
#
# Use the FTP account from hPanel → Files → FTP Accounts (port 21).
# Port 65002 is SSH/SFTP and stays closed unless Remote Access is enabled.
name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Copy SPA .htaccess
        run: cp public/.htaccess dist/leo-chiasso/browser/.htaccess

      - name: Verify FTP host resolves
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if [ -z "$host" ]; then
            echo "::error::FTP_SERVER secret is empty."
            exit 1
          fi
          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::error::Cannot resolve FTP host '$host'."
            echo "::error::Hostinger: hPanel → Websites → Dashboard → Files → FTP Accounts → copy **FTP IP** (numeric)."
            exit 1
          fi
          echo "FTP host resolves."

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/leo-chiasso/browser/
          server-dir: ./
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/assets/brand/**
            **/assets/media/**
            **/organic-dreams-desfile.MOV
