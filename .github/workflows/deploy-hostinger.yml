# Build Angular (production) and upload to Hostinger via SFTP (port 65002).
#
# Secrets in GitHub Environment "FTP_SERVER" (Settings → Environments → FTP_SERVER):
#   FTP_SERVER     — FTP IP from hPanel (numeric), NOT ftp.yourdomain.com
#   FTP_USERNAME   — FTP username from hPanel
#   FTP_PASSWORD   — FTP password
#   FTP_REMOTE_DIR — e.g. /domains/leonardochiasso.com/public_html or /public_html
#
# Enable SFTP in hPanel: Websites → Dashboard → Advanced → Remote access (SSH/SFTP).
name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Copy SPA .htaccess
        run: cp public/.htaccess dist/leo-chiasso/browser/.htaccess

      - name: Verify FTP host resolves
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if [ -z "$host" ]; then
            echo "::error::FTP_SERVER secret is empty."
            exit 1
          fi
          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::error::Cannot resolve FTP host '$host'."
            echo "::error::Hostinger: hPanel → Websites → Dashboard → Files → FTP Accounts → copy **FTP IP** (numeric, e.g. 147.79.x.x)."
            echo "::error::Do NOT use ftp.leonardochiasso.com — that subdomain has no DNS record."
            exit 1
          fi
          echo "FTP host resolves."

      - name: Deploy to Hostinger (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          ssh_private_key: ''
          port: 65002
          sftp_only: true
          local_path: ./dist/leo-chiasso/browser/*
          remote_path: ${{ secrets.FTP_REMOTE_DIR }}
          # Keep organic-dreams-desfile.MOV (~2 GB) already on Hostinger.
          delete_remote_files: false
