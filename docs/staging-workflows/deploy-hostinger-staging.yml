# Build Angular (staging) e upload para staging.leonardochiasso.com via FTP.
# Secrets no GitHub Environment "FTP_STAGING": FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (conta FTP presa na pasta do subdomínio staging → server-dir ./).
# Sem secrets, o job termina sem deploy (aviso, não erro).
name: Deploy frontend staging to Hostinger

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_STAGING
    steps:
      - name: Check FTP secrets
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ok=true
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || { echo "::warning::Secret $name ausente em FTP_STAGING — deploy pulado."; ok=false; }
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build (staging)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npm ci
          npm run build -- --configuration=staging

      - name: Copy SPA .htaccess
        if: steps.secrets.outputs.ok == 'true'
        run: |
          cp public/.htaccess dist/leo-chiasso/browser/.htaccess
          test -f dist/leo-chiasso/browser/index.html

      - name: Deploy to Hostinger staging (FTP)
        if: steps.secrets.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/leo-chiasso/browser/
          server-dir: ./
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/assets/media/**
