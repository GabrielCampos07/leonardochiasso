# Staging API no mesmo Hetzner da prod. Sem portas: o Caddy da prod
# (docker-compose.prod.yml) faz o proxy de api-staging.leonardochiasso.com.
# Uso (em /opt/leo-chiasso-staging/api):
#   docker compose -f docker-compose.staging.yml up -d --build
name: leo-staging

services:
  api-staging:
    build: .
    env_file: .env.staging
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - prod_caddy

networks:
  prod_caddy:
    external: true
    # Rede default do compose da prod (projeto "api" em /opt/leo-chiasso/api).
    name: ${PROD_CADDY_NETWORK:-api_default}
