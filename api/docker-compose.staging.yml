# Staging no Hetzner (mesmo servidor da prod, pasta /opt/leo-chiasso-staging).
# Só a API, publicada em 127.0.0.1:3001 — o Caddy da prod faz o TLS de
# api-staging.leonardochiasso.com (ver docs no workflow deploy-api-staging.yml).
# Uso: docker compose -p leo-staging -f docker-compose.staging.yml up -d --build
services:
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
