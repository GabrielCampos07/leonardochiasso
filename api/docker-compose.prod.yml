# Produção no Hetzner: API + HTTPS (Caddy).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
