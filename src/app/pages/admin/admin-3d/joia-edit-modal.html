<div class="product-edit-modal" tabindex="-1">
  <header class="product-edit-modal__head">
    <div>
      <p class="product-edit-modal__kicker">Ateliê · 3D · Joias</p>
      <h2 [id]="titleId">{{ title }}</h2>
    </div>
    <button type="button" class="product-edit-modal__close" (click)="close()" [disabled]="saving()">
      Fechar
    </button>
  </header>

  @if (loading()) {
    <p class="product-edit-modal__status">Carregando peça…</p>
  } @else if (missing()) {
    <p class="product-edit-modal__status">Joia não encontrada.</p>
  } @else if (piece(); as p) {
    <form class="admin-edit__form" (ngSubmit)="save()">
      <label>
        Título
        <input
          id="atelier-joia-title"
          type="text"
          [ngModel]="p.title"
          (ngModelChange)="patch('title', $event)"
          name="title"
          autocomplete="off"
          required
        />
      </label>
      <label>
        Preço (texto)
        <input
          type="text"
          [ngModel]="p.priceLabel"
          (ngModelChange)="patch('priceLabel', $event)"
          id="atelier-joia-price"
          name="priceLabel"
          autocomplete="off"
        />
      </label>
      <label>
        Descrição
        <textarea
          id="atelier-joia-description"
          rows="4"
          [ngModel]="p.description"
          (ngModelChange)="patch('description', $event)"
          name="description"
          autocomplete="off"
        ></textarea>
      </label>
      <label>
        Fotos (uma URL por linha)
        <textarea
          id="atelier-joia-images"
          rows="4"
          [ngModel]="imagesText()"
          (ngModelChange)="onImagesChange($event)"
          name="images"
          autocomplete="off"
        ></textarea>
      </label>
      <div class="admin-edit__footer">
        <button
          type="submit"
          class="admin-edit__save"
          [disabled]="saving()"
          [attr.aria-busy]="saving()"
        >
          {{ saving() ? 'Salvando…' : 'Salvar' }}
        </button>
        <button type="button" class="admin-edit__cancel" (click)="close()" [disabled]="saving()">
          Cancelar
        </button>
        @if (!creating) {
          <button type="button" class="admin-edit__archive" [disabled]="saving()" (click)="archive()">
            Arquivar
          </button>
        }
      </div>
    </form>
  }
</div>
