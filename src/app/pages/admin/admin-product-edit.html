@if (missing()) {
  <section class="admin-edit">
    <h1>Produto não encontrado</h1>
    <a [routerLink]="listPath">Voltar à lista</a>
  </section>
} @else if (draft(); as p) {
  <section class="admin-edit">
    <header class="admin-edit__head">
      <div>
        <a class="admin-edit__back" [routerLink]="listPath">← Voltar</a>
        <h1>{{ isNew() ? 'Adicionar produto' : 'Editar produto' }}</h1>
        <p>{{ isNew() ? 'Preencha os campos mínimos e salve.' : p.name }}</p>
      </div>
    </header>

    @if (isArchived()) {
      <div class="admin-edit__archived" role="status">
        <strong>Arquivado</strong>
        <span>Esta peça não aparece no site.</span>
        <button
          type="button"
          class="admin-row__order-btn"
          (click)="restore()"
          [disabled]="restoring() || deleting()"
          [attr.aria-busy]="restoring()"
        >
          {{ restoring() ? 'Restaurando…' : 'Restaurar' }}
        </button>
        <button
          type="button"
          class="admin-row__archive"
          (click)="remove()"
          [disabled]="deleting() || restoring()"
          [attr.aria-busy]="deleting()"
        >
          {{ deleting() ? 'Excluindo…' : 'Excluir' }}
        </button>
      </div>
    }

    <lc-admin-product-form
      [product]="p"
      [isNew]="isNew()"
      [collectionFromContext]="collectionFromContext()"
      [collectionRequired]="collectionRequired()"
      (saved)="onSaved($event)"
      (archived)="onArchived($event)"
      (cancelled)="cancel()"
    />
  </section>
}
