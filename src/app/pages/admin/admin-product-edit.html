@if (missing()) {
  <section class="admin-edit">
    <h1>Produto não encontrado</h1>
    <a [routerLink]="listPath">Voltar à lista</a>
  </section>
} @else if (draft(); as p) {
  <section class="admin-edit">
    <header class="admin-edit__head">
      <div>
        <a class="admin-edit__back" [routerLink]="listPath">← Voltar</a>
        <h1>{{ isNew() ? 'Adicionar produto' : 'Editar produto' }}</h1>
        <p>{{ isNew() ? 'Preencha os campos mínimos e salve.' : p.name }}</p>
      </div>
    </header>

    <lc-admin-product-form
      [product]="p"
      [isNew]="isNew()"
      [collectionFromContext]="collectionFromContext()"
      [collectionRequired]="collectionRequired()"
      (saved)="onSaved($event)"
      (archived)="onArchived($event)"
      (cancelled)="cancel()"
    />
  </section>
}
