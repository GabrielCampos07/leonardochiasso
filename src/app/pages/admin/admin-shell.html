@if (stagingBanner) {
  <div class="admin-staging-banner" role="status">{{ stagingBanner }}</div>
}
<header class="admin-bar">
  <div class="admin-bar__brand">
    <strong>Leo Chiasso</strong>
    <span>Área do ateliê · produtos</span>
  </div>
  <nav class="admin-bar__nav">
    @if (loggedIn()) {
      <div
        class="admin-view-toggle"
        role="radiogroup"
        aria-label="Modo de visualização"
        (keydown)="onViewKeydown($event)"
      >
        <button
          type="button"
          id="admin-view-list"
          class="admin-view-toggle__btn"
          role="radio"
          [attr.aria-checked]="selectedView() === 'list'"
          [attr.aria-pressed]="selectedView() === 'list'"
          [class.is-on]="selectedView() === 'list'"
          (click)="setViewMode('list')"
        >
          Lista
        </button>
        <button
          type="button"
          id="admin-view-3d"
          class="admin-view-toggle__btn"
          role="radio"
          [attr.aria-checked]="selectedView() === '3d'"
          [attr.aria-pressed]="selectedView() === '3d'"
          [class.is-on]="selectedView() === '3d'"
          (click)="setViewMode('3d')"
        >
          3D
        </button>
      </div>
      <a [routerLink]="products">Produtos</a>
      <a [routerLink]="collections">Coleções</a>
      <a [routerLink]="joias">Joias</a>
      <a [routerLink]="home">Abrir o site</a>
      <button type="button" class="admin-bar__out" (click)="logout()">Sair</button>
    }
  </nav>
</header>
<main class="admin-main" [class.admin-main--scene]="sceneHost">
  <router-outlet />
</main>
<lc-toast-host />
<lc-confirm-dialog />
