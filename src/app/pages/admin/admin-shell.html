@if (stagingBanner) {
  <div class="admin-staging-banner" role="status">{{ stagingBanner }}</div>
}
<header class="admin-bar">
  <div class="admin-bar__top">
    <div class="admin-bar__brand">
      <strong>Leo Chiasso</strong>
      <span>Área do ateliê · {{ sectionLabel() }}</span>
    </div>
    @if (loggedIn()) {
      <div
        class="admin-view-toggle"
        role="radiogroup"
        aria-label="Modo de visualização"
        (keydown)="onViewKeydown($event)"
      >
        <button
          type="button"
          id="admin-view-list"
          class="admin-view-toggle__btn"
          role="radio"
          [attr.aria-checked]="selectedView() === 'list'"
          [attr.aria-pressed]="selectedView() === 'list'"
          [class.is-on]="selectedView() === 'list'"
          (click)="setViewMode('list')"
        >
          Lista
        </button>
        <button
          type="button"
          id="admin-view-3d"
          class="admin-view-toggle__btn"
          role="radio"
          [attr.aria-checked]="selectedView() === '3d'"
          [attr.aria-pressed]="selectedView() === '3d'"
          [class.is-on]="selectedView() === '3d'"
          (click)="setViewMode('3d')"
        >
          3D
        </button>
      </div>
    }
  </div>
  @if (loggedIn()) {
    <button
      type="button"
      class="admin-bar__menu-btn"
      [attr.aria-expanded]="navOpen()"
      aria-label="Menu"
      (click)="toggleNav($event)"
    >
      Menu
    </button>
    <div class="admin-bar__nav-wrap" [class.is-open]="navOpen()">
      <nav class="admin-bar__nav">
        <a [routerLink]="products" (click)="closeNav()">Produtos</a>
        <a [routerLink]="collections" (click)="closeNav()">Coleções</a>
        <a [routerLink]="joias" (click)="closeNav()">Joias</a>
        <a [routerLink]="home" (click)="closeNav()">Abrir o site</a>
      </nav>
      <button type="button" class="admin-bar__out" (click)="logout()">Sair</button>
    </div>
  }
</header>
<main class="admin-main" [class.admin-main--scene]="sceneHost">
  @if (showSceneBoot()) {
    <div class="admin-3d-route-boot" role="status">
      <div class="admin-3d-route-boot__spinner" aria-hidden="true"></div>
      <div class="admin-3d-route-boot__skel" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p>Montando o ateliê…</p>
    </div>
  }
  <router-outlet />
</main>
<lc-toast-host placement="top" />
<lc-confirm-dialog />
