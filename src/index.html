<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Leonardo Chiasso</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Leonardo Chiasso — Luxury through Nature. Architecture through Fabric. HempCouture."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@300;400;500&family=Quicksand:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        if (/\/admin\/3d(?:\/|$|\?|#)/.test(location.pathname + location.search + location.hash)) {
          document.documentElement.classList.add('lc-atelier-booting');
        }
      })();
    </script>
    <style>
      html.lc-atelier-booting,
      html.lc-atelier-booting body {
        background: #efe8dc;
      }
      #lc-atelier-boot {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 0;
        background: #efe8dc;
        color: #2a2118;
        font-family: Quicksand, "Encode Sans Expanded", sans-serif;
      }
      html.lc-atelier-booting #lc-atelier-boot,
      #lc-atelier-boot.is-on {
        display: flex;
      }
      #lc-atelier-boot p {
        margin: 0;
        font-size: 0.95rem;
      }
      #lc-atelier-boot .lc-atelier-boot__spin {
        width: 28px;
        height: 28px;
        border: 2px solid rgb(42 33 24 / 18%);
        border-top-color: #2a2118;
        border-radius: 50%;
        animation: lc-atelier-boot-spin 0.8s linear infinite;
      }
      @keyframes lc-atelier-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="lc-atelier-boot" role="status">
      <div class="lc-atelier-boot__spin" aria-hidden="true"></div>
      <p>Montando o ateliê…</p>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('lc-atelier-boot');
        if (boot && document.documentElement.classList.contains('lc-atelier-booting')) {
          boot.classList.add('is-on');
        }
      })();
    </script>
    <lc-root></lc-root>
  </body>
</html>
